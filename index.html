<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1215" />
    <meta name="description" content="F1 dashboard: live timing, FIA race control messages, standings and calendar." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    />
    <title>Pit Wall</title>
    <script>
      // Theme before the first paint (see src/lib/theme.ts).
      (function () {
        var t = 'dark';
        try { t = JSON.parse(localStorage.getItem('pitwall:settings') || '{}').theme || 'dark'; } catch (e) {}
        var light = t === 'light' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.resolvedTheme = light ? 'light' : 'dark';
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pit Wall needs JavaScript to load live F1 data.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
