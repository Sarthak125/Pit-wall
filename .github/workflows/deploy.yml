name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every 3 hours: refresh Pit Wall's copy of the Jolpica data (calendar, results, standings) and republish.
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site only deploys if these pass: unit tests, then browser tests at laptop and phone width
  # against recorded API responses (so they don't depend on the live APIs or their rate limits).
  # Scheduled runs only refresh the data copy (the code on main was tested when it was pushed).
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tests/tsconfig.json
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
  build:
    needs: test
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pit Wall's own copy of the Jolpica data, published under data/jolpica/. When Jolpica cannot be reached, the
      # copy already on the live site is kept. This step never stops a deploy.
      - name: Copy Jolpica data
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/mirror-jolpica.mjs dist/data/jolpica https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
