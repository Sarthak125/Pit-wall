name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every 3 hours: refresh Pit Wall's copy of the Jolpica data (calendar, results, standings) and republish.
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site only deploys if these pass: unit tests, and browser tests at laptop and phone width against recorded API
  # responses (so they don't depend on the live APIs or their rate limits). The browser tests are split across four
  # machines, and the site is built at the same time, so a deploy waits for the slowest quarter rather than all of them.
  # Scheduled runs only refresh the data copy (the code on main was tested when it was pushed).
  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tests/tsconfig.json
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser download is cached by Playwright version; the system libraries it needs are installed each time.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The tests build against a stand-in Supabase address that tests/e2e/account.spec.ts answers itself.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://pitwall-test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-public-key-not-a-real-project
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sign-in appears only when the repository has the Supabase project's URL and public key as Actions variables
      # (Settings > Secrets and variables > Actions > Variables). The public key is meant to be in the page; the
      # database's row rules in supabase/migrations keep each account to its own row.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROVIDERS: ${{ vars.SUPABASE_PROVIDERS }}
      # Pit Wall's own copy of the Jolpica data, published under data/jolpica/. When Jolpica cannot be reached, the
      # copy already on the live site is kept. This step never stops a deploy.
      - name: Copy Jolpica data
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/mirror-jolpica.mjs dist/data/jolpica https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # The same for finished sessions of OpenF1 (laps, stints, pit stops, race control, results): race pages then open at
      # once and still work while OpenF1 is slow or refusing requests. Stops when OpenF1 refuses or after 14 minutes
      # (its limit is 30 requests a minute); the next run carries on. This step never stops a deploy either.
      - name: Copy OpenF1 data
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/mirror-openf1.mjs dist/data/openf1 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Driver photos for the driver cards: each driver's lead Wikipedia photo when it is a freely licensed image on
      # Wikimedia Commons, saved with its author and licence. Reuses the live site's files, so a normal run only looks
      # for new drivers. This step never stops a deploy either.
      - name: Copy driver photos
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/mirror-photos.mjs dist/data/photos https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ dist/data/jolpica
      # The weekend forecast for the race weekend under way and the next one, used by the app when Open-Meteo does not
      # answer (it caps requests per network address per day). Keeps the live site's copy when Open-Meteo refuses.
      # This step never stops a deploy either.
      - name: Copy weekend forecast
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/mirror-weather.mjs dist/data/weather dist/data/jolpica https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    # Waits for the tests as well as the build; on scheduled runs the tests are skipped, which counts as passing here.
    needs: [unit, e2e, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  # After each run, look at the live copy. If it is older than 12 hours (four refreshes missed) or missing, open an
  # issue (or add a comment to the open one); when it is fresh again, close the issue. With Issues switched off for the
  # repository, a stale copy makes this job fail instead.
  copy-health:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the copy
        id: check
        continue-on-error: true
        run: node scripts/check-copy.mjs https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ | tee verdict.txt
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          verdict=$(cat verdict.txt 2>/dev/null || echo "Jolpica copy could not be checked.")
          # Issues switched off for the repository: no issue to open, so a stale copy turns this job red instead
          # (GitHub emails the failure to whoever pushed or last edited the workflow).
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            if [ "$OUTCOME" = "success" ]; then echo "$verdict"; exit 0; fi
            echo "::error::$verdict The scheduled refresh of the Jolpica data copy has not succeeded for about 12 hours."
            exit 1
          fi
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Jolpica data copy is out of date"' --json number --jq '.[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "$verdict The copy is fresh again. ($run_url)"
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$verdict Still out of date. ($run_url)"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Jolpica data copy is out of date" \
              --body "$verdict"$'\n\n'"The scheduled job that refreshes Pit Wall's copy of the Jolpica data has not succeeded for about 12 hours. The app falls back to Jolpica directly and to the OpenF1 backup, so pages still work but may be slower. Likely causes: Jolpica is down or rate limiting (look for 403, 429 or 504 in the 'Copy Jolpica data' step), or the job is failing. This issue closes itself when the copy is fresh. Latest run: $run_url"
          fi
